name: 🐛 Bug Report
description: Report a bug to help us improve GitGraph Studio
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the form below as completely as possible to help us resolve the issue quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue here...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened...
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen Recordings
      description: If applicable, add screenshots or recordings to help explain your problem.
      placeholder: Drag and drop or paste images/links here...
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did you encounter this issue?
      options:
        - Local Development (npm run dev)
        - Live Production (gitgraph.studio)
        - Vercel Deployment
        - Azure Deployment
        - Other (please specify in comments)
    validations:
      required: true
  - type: textarea
    id: specs
    attributes:
      label: System & Browser Info
      description: OS version, browser version, Node.js version, etc.
      placeholder: e.g., Windows 11, Chrome 120, Node.js v20.10.0
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please check the following before submitting
      options:
        - label: I have searched existing issues to ensure this bug has not already been reported.
          required: true
        - label: I have read the [Contributing Guidelines](https://github.com/Nandansai08/gitgraph.studio/blob/main/CONTRIBUTING.md).
          required: true
