name: 💡 Feature Request
description: Propose a new feature or enhancement for GitGraph Studio
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make GitGraph Studio better? We'd love to hear it! Please complete this form to help us understand your proposal.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: e.g., I'm frustrated when...
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
      placeholder: Describe the feature or improvement...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: Any other ways this could be handled...
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockup designs, screenshots, or examples here.
      placeholder: Anything else that might be helpful...
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please check the following before submitting
      options:
        - label: I have searched existing issues to ensure this feature has not been requested before.
          required: true
        - label: I am willing to work on implementing this feature myself (if approved).
          required: false
