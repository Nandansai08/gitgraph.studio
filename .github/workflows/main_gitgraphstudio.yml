# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - gitgraphstudio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          NEXTAUTH_SECRET: temp_secret_for_building_only
          DATABASE_URL: postgresql://temp:temp@localhost:5432/temp

      - name: Run Prisma Generate
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://temp:temp@localhost:5432/temp

      - name: Build Next.js app
        run: npm run build
        env:
          NEXTAUTH_SECRET: temp_secret_for_building_only
          DATABASE_URL: postgresql://temp:temp@localhost:5432/temp

      - name: Package deployment artifact
        run: |
          mkdir -p deploy-package
          cp -r .next deploy-package/
          cp -r public deploy-package/ 2>/dev/null || true
          cp package.json deploy-package/
          cp next.config.* deploy-package/ 2>/dev/null || true
          cp prisma deploy-package/ -r 2>/dev/null || true
          cd deploy-package
          npm install --omit=dev --legacy-peer-deps
          cp -r ../node_modules/.prisma node_modules/ 2>/dev/null || true
          zip -ry ../deploy.zip .
          cd ..

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_019020EE8AEA4CD394B8D00EF2733B58 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EB1DECD2E83B43D38D381FDA23764FEF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_74853737ACA747DF9BA9C2216809F663 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gitgraphstudio'
          slot-name: 'Production'
          package: deploy.zip
